<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RF Verification App — Development Tracker</title>
<style>
:root{
  --bg:#07090D; --panel:#0D1117; --panel-2:#111820; --line:#1C2733;
  --txt:#D6E2EC; --dim:#7B8B9A; --faint:#4A5A6A;
  --teal:#2FD4C4; --cyan:#39B7E8; --amber:#E8B339; --red:#E8615A; --grey:#5A6B7B;
  --mono:ui-monospace,"Cascadia Mono","Consolas","DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font:14px/1.55 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  padding:28px 22px 60px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto}

header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px}
h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.2px}
h1 span{color:var(--teal)}
.sub{color:var(--dim);font-size:12.5px}
.repo{font-family:var(--mono);font-size:12px;color:var(--faint);margin-left:auto}

.bar-outer{margin:22px 0 6px;height:9px;border-radius:5px;background:var(--panel-2);
  border:1px solid var(--line);overflow:hidden}
.bar-inner{height:100%;background:linear-gradient(90deg,var(--teal),var(--cyan));
  width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar-meta{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;
  font-family:var(--mono)}
.bar-meta b{color:var(--txt);font-weight:600}

.counts{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 26px}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:20px;
  padding:5px 13px;font-size:12px;font-family:var(--mono);color:var(--dim);
  cursor:pointer;user-select:none;transition:border-color .15s,color .15s}
.pill:hover{border-color:var(--faint);color:var(--txt)}
.pill.on{border-color:var(--teal);color:var(--teal)}
.pill i{font-style:normal;color:var(--txt);font-weight:600}

h2{font-size:12px;text-transform:uppercase;letter-spacing:1.3px;color:var(--dim);
  font-weight:600;margin:30px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:11px}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--grey);
  border-radius:7px;padding:12px 14px;transition:transform .12s,border-color .15s}
.card:hover{transform:translateY(-1px);border-color:var(--faint)}
.card .top{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.id{font-family:var(--mono);font-size:12px;color:var(--teal);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--grey);flex:none;margin-left:auto}
.title{font-size:13.5px;line-height:1.4;margin-bottom:9px}
.tags{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;
  color:var(--faint)}
.tag{border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.tag.r2{color:var(--amber);border-color:#3A2F14}
.tag.r1{color:var(--cyan);border-color:#123040}
.tag.st{color:var(--dim)}

.s-done{border-left-color:var(--teal)} .s-done .dot{background:var(--teal)}
.s-done .id{color:var(--teal)}
.s-in-progress{border-left-color:var(--cyan)} .s-in-progress .dot{background:var(--cyan);
  animation:pulse 1.9s ease-in-out infinite}
.s-in-review{border-left-color:var(--amber)} .s-in-review .dot{background:var(--amber)}
.s-blocked{border-left-color:var(--red)} .s-blocked .dot{background:var(--red)}
.s-blocked .id{color:var(--red)}
.s-planned{border-left-color:var(--line)} .s-planned .dot{background:var(--grey)}
.s-planned .id{color:var(--dim)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}

.jrn{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 16px}
.jrn div{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.jrn div:last-child{border-bottom:0}
.jrn span{font-family:var(--mono);font-size:11.5px;color:var(--teal);margin-right:10px}

table{width:100%;border-collapse:collapse;background:var(--panel);
  border:1px solid var(--line);border-radius:7px;overflow:hidden}
th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);
  font-size:12.5px;vertical-align:top}
th{color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
tr:last-child td{border-bottom:0}
td.d{font-family:var(--mono);color:var(--teal);white-space:nowrap;font-weight:600}
td.q{color:var(--txt);width:34%}
td.p{color:var(--dim)}
.badge{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:4px;
  border:1px solid var(--line);color:var(--amber);white-space:nowrap}
.badge.accepted{color:var(--teal);border-color:#12332F}

.err{background:var(--panel);border:1px solid #3A2F14;border-left:3px solid var(--amber);
  border-radius:7px;padding:16px 18px;color:var(--dim);font-size:13px}
.err code{font-family:var(--mono);color:var(--teal);background:var(--panel-2);
  padding:2px 6px;border-radius:4px;display:inline-block;margin:5px 0}
footer{margin-top:36px;color:var(--faint);font-size:11.5px;font-family:var(--mono);
  border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>RF Verification App — <span>Development Tracker</span></h1>
    <div class="sub">Flatness · Power Accuracy · IQ Validation</div>
    <div class="repo">Andrei7486/rf_verification_app</div>
  </header>

  <div class="bar-outer"><div class="bar-inner" id="bar"></div></div>
  <div class="bar-meta">
    <span id="pct">—</span>
    <span id="weights"></span>
  </div>

  <div class="counts" id="counts"></div>
  <div id="body"></div>

  <footer id="foot">Parsed live from ROADMAP.md and VALIDATION_APP_SPEC.md — no separate data file.</footer>
</div>

<script>
"use strict";

var ORDER = ["in-progress","in-review","blocked","planned","done"];
var LABEL = {"P0":"Gates — operator actions","infra":"Infrastructure",
             "M":"Measurement track","U":"Interface track"};
var GROUPS = ["P0","infra","M","U"];

function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML;}

function block(text,name){
  var a=text.indexOf("<!-- "+name+":BEGIN -->");
  var b=text.indexOf("<!-- "+name+":END -->");
  return (a<0||b<0)?"":text.slice(a,b);
}

function rows(md){
  var out=[];
  md.split("\n").forEach(function(l){
    l=l.trim();
    if(l.charAt(0)!=="|") return;
    var c=l.slice(1,-1).split("|").map(function(x){return x.trim();});
    if(!c.length||/^-+$/.test(c[0])||c[0]==="#"||c[0]==="ID") return;
    out.push(c);
  });
  return out;
}

function card(r){
  var st=(r[5]||"planned").toLowerCase();
  var tags='<span class="tag st">'+esc(st)+"</span>";
  if(r[3]&&r[3]!=="—") tags+='<span class="tag '+r[3].toLowerCase()+'">'+esc(r[3])+"</span>";
  if(r[6]&&r[6]!=="—") tags+='<span class="tag">'+esc(r[6])+"</span>";
  return '<div class="card s-'+st+'"><div class="top"><span class="id">'+esc(r[0])+
    '</span><span class="dot"></span></div><div class="title">'+esc(r[1])+
    '</div><div class="tags">'+tags+"</div></div>";
}

function render(stages,decisions,journal){
  var total=0,done=0,by={};
  stages.forEach(function(r){
    var w=parseInt(r[4],10)||1, st=(r[5]||"planned").toLowerCase();
    total+=w; if(st==="done") done+=w;
    by[st]=(by[st]||0)+1;
  });
  var pct=total?Math.round(done/total*100):0;
  document.getElementById("bar").style.width=pct+"%";
  document.getElementById("pct").innerHTML="<b>"+pct+"%</b> complete by weight";
  document.getElementById("weights").textContent=done+" / "+total+" weighted units";

  var c="";
  ORDER.forEach(function(s){
    if(by[s]) c+='<span class="pill" data-f="'+s+'"><i>'+by[s]+"</i> "+s+"</span>";
  });
  c+='<span class="pill on" data-f="all"><i>'+stages.length+"</i> all</span>";
  document.getElementById("counts").innerHTML=c;

  var h="";
  GROUPS.forEach(function(g){
    var list=stages.filter(function(r){return r[2]===g;});
    if(!list.length) return;
    h+="<h2>"+LABEL[g]+"</h2><div class='grid'>"+list.map(card).join("")+"</div>";
  });

  if(decisions.length){
    h+="<h2>Open decisions</h2><table><tr><th>#</th><th>Question</th><th>Proposed answer</th>"+
       "<th>Status</th></tr>";
    decisions.forEach(function(r){
      var st=(r[3]||"open").toLowerCase();
      h+='<tr><td class="d">'+esc(r[0])+'</td><td class="q">'+esc(r[1])+
         '</td><td class="p">'+esc(r[2])+'</td><td><span class="badge '+
         (st==="accepted"?"accepted":"")+'">'+esc(st)+"</span></td></tr>";
    });
    h+="</table>";
  }

  if(journal.length){
    h+="<h2>Recent journal entries</h2><div class='jrn'>"+journal.map(function(j){
      return "<div><span>"+esc(j.d)+"</span>"+esc(j.t)+"</div>";
    }).join("")+"</div>";
  }
  document.getElementById("body").innerHTML=h;

  document.getElementById("counts").addEventListener("click",function(e){
    var p=e.target.closest(".pill"); if(!p) return;
    var f=p.getAttribute("data-f");
    [].forEach.call(this.querySelectorAll(".pill"),function(x){x.classList.remove("on");});
    p.classList.add("on");
    [].forEach.call(document.querySelectorAll(".card"),function(card){
      card.style.display=(f==="all"||card.classList.contains("s-"+f))?"":"none";
    });
  });
}

function parseJournal(md){
  var out=[];
  md.split("\n").forEach(function(l){
    var m=/^##\s+(\d{4}-\d{2}-\d{2})\s*—?\s*(.*)$/.exec(l.trim());
    if(m) out.push({d:m[1],t:m[2]||"(untitled)"});
  });
  return out.reverse().slice(0,6);
}

function get(f){
  return fetch(f,{cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error(f+" -> "+r.status); return r.text();
  });
}

Promise.all([get("ROADMAP.md"),get("VALIDATION_APP_SPEC.md")])
  .then(function(t){
    return get("JOURNAL.md").catch(function(){return "";}).then(function(j){
      render(rows(block(t[0],"STAGES")), rows(block(t[1],"DECISIONS")), parseJournal(j));
      document.getElementById("foot").textContent =
        "Parsed live from ROADMAP.md and VALIDATION_APP_SPEC.md at " +
        new Date().toLocaleString() + " — no separate data file, so it cannot go stale.";
    });
  })
  .catch(function(e){
    document.getElementById("body").innerHTML =
      '<div class="err"><b>Cannot read the source documents.</b><br><br>' +
      'This page reads <code>ROADMAP.md</code> and <code>VALIDATION_APP_SPEC.md</code> from the ' +
      'same folder, which browsers block when a page is opened directly from disk ' +
      '(<code>file://</code>). Serve the folder instead:<br>' +
      '<code>cd docs &amp;&amp; python -m http.server 8080</code><br>' +
      'then open <code>http://localhost:8080/progress.html</code>.<br><br>' +
      '<span style="color:#4A5A6A">' + esc(e.message) + '</span></div>';
    document.getElementById("pct").textContent = "—";
  });
</script>
</body>
</html>
